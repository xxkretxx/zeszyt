name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools | tail -5

      - name: Install & build web app
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          cp -r native/res/* android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Use fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Zeszyt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zeszyt-apk
          path: Zeszyt.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zeszyt 1.0.${{ github.run_number }}
          body: Pobierz **Zeszyt.apk** na telefonie i zainstaluj.
          files: Zeszyt.apk
